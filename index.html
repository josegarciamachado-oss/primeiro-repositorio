<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelVerse Games - Catálogo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121214;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            border-bottom: 2px solid #8257e5;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .servico-info {
            background-color: #202024;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
        }
        .filtros {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filtros input, .filtros select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #323238;
            background-color: #202024;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .filtros input {
            flex: 1;
            min-width: 200px;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 15px;
        }
        .card {
            background-color: #202024;
            border: 1px solid #323238;
            border-radius: 8px;
            padding: 15px;
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 10px;
        }
        .badge-sub { background-color: #04d361; color: #000; }
        .badge-compra { background-color: #e16e0e; color: #fff; }
        .sem-resultados {
            color: #8d8d99;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>PixelVerse Games</h1>
        </div>

        <div class="servico-info">
            <h2>Como funciona nosso serviço</h2>
            <p><strong>1. Assinatura Mensal (R$ 29,90/mês):</strong> Jogue todos os títulos marcados como 'Incluso na Assinatura'.</p>
            <p><strong>2. Compra Avulsa:</strong> Adquira qualquer jogo individualmente para ser seu para sempre.</p>
        </div>

        <h2>Catálogo de Jogos</h2>
        
        <div class="filtros">
            <input type="text" id="campoBusca" placeholder="Buscar por título...">
            <select id="filtroGenero">
                <option value="Todos">Todos os Gêneros</option>
                <option value="RPG">RPG</option>
                <option value="Corrida">Corrida</option>
                <option value="Estratégia">Estratégia</option>
            </select>
        </div>

        <div class="card-grid" id="catalogo"></div>
    </div>

    <script>
        const jogos = [
            { titulo: "Cyber Odyssey", genero: "RPG", preco: 149.90, inclusoNoPlano: true },
            { titulo: "Speed Racers", genero: "Corrida", preco: 89.90, inclusoNoPlano: true },
            { titulo: "Galactic Legends", genero: "Estratégia", preco: 199.90, inclusoNoPlano: false }
        ];

        const container = document.getElementById('catalogo');
        const campoBusca = document.getElementById('campoBusca');
        const filtroGenero = document.getElementById('filtroGenero');

        function renderizarJogos() {
            const termoBusca = campoBusca.value.toLowerCase();
            const generoSelecionado = filtroGenero.value;

            container.innerHTML = '';

            const jogosFiltrados = jogos.filter(jogo => {
                const combinaTitulo = jogo.titulo.toLowerCase().includes(termoBusca);
                const combinaGenero = generoSelecionado === 'Todos' || jogo.genero === generoSelecionado;
                return combinaTitulo && combinaGenero;
            });

            if (jogosFiltrados.length === 0) {
                container.innerHTML = '<p class="sem-resultados">Nenhum jogo encontrado com os filtros aplicados.</p>';
                return;
            }

            jogosFiltrados.forEach(jogo => {
                const card = document.createElement('div');
                card.className = 'card';
                
                const badgeClass = jogo.inclusoNoPlano ? 'badge-sub' : 'badge-compra';
                const badgeTexto = jogo.inclusoNoPlano ? 'Incluso na Assinatura' : 'Apenas Compra Avulsa';

                card.innerHTML = `
                    <h3>${jogo.titulo}</h3>
                    <p>Gênero: ${jogo.genero}</p>
                    <p>Preço: R$ ${jogo.preco.toFixed(2)}</p>
                    <span class="badge ${badgeClass}">${badgeTexto}</span>
                `;
                container.appendChild(card);
            });
        }

        // Eventos para filtrar em tempo real
        campoBusca.addEventListener('input', renderizarJogos);
        filtroGenero.addEventListener('change', renderizarJogos);

        // Renderização inicial
        renderizarJogos();
    </script>
</body>
</html>
