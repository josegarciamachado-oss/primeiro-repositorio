<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelVerse Games - Catálogo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0e12;
            color: #e1e1e6;
            padding: 30px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #9466ff, #04d361);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        header p {
            color: #a8a8b3;
            font-size: 1.1rem;
        }

        /* Banner de explicação do serviço */
        .servico-info {
            background: linear-gradient(135deg, #181920 0%, #20222c 100%);
            border: 1px solid #2e303d;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 30px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
        }

        .servico-info h2 {
            font-size: 1.3rem;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .servico-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }

        .servico-card {
            background-color: #121318;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #9466ff;
        }

        .servico-card.compra {
            border-left-color: #f75a68;
        }

        .servico-card h3 {
            font-size: 1rem;
            color: #fff;
            margin-bottom: 5px;
        }

        .servico-card p {
            font-size: 0.9rem;
            color: #a8a8b3;
        }

        /* Área de Filtros */
        .filtros {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .filtros input, .filtros select {
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #2e303d;
            background-color: #181920;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .filtros input:focus, .filtros select:focus {
            border-color: #9466ff;
        }

        .filtros input {
            flex: 2;
            min-width: 200px;
        }

        .filtros select {
            flex: 1;
            min-width: 160px;
            cursor: pointer;
        }

        /* Grid de Jogos */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background-color: #181920;
            border: 1px solid #2e303d;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: #9466ff;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        .card h3 {
            font-size: 1.2rem;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .card-detalhes {
            margin-bottom: 15px;
        }

        .genero {
            display: inline-block;
            background-color: #2e303d;
            color: #04d361;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .preco {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
        }

        .badge {
            display: block;
            text-align: center;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-sub {
            background-color: rgba(4, 211, 97, 0.15);
            color: #04d361;
            border: 1px solid #04d361;
        }

        .badge-compra {
            background-color: rgba(247, 90, 104, 0.15);
            color: #f75a68;
            border: 1px solid #f75a68;
        }

        .sem-resultados {
            color: #a8a8b3;
            grid-column: 1 / -1;
            text-align: center;
            padding: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>PixelVerse Games</h1>
            <p>Sua plataforma definitiva de jogos online</p>
        </header>

        <div class="servico-info">
            <h2>Como funciona o serviço?</h2>
            <div class="servico-grid">
                <div class="servico-card">
                    <h3>Assinatura PixelPass (R$ 29,90/mês)</h3>
                    <p>Acesso ilimitado a todos os jogos marcados como <strong>Incluso no Plano</strong>.</p>
                </div>
                <div class="servico-card compra">
                    <h3>Loja de Compras</h3>
                    <p>Compre qualquer título individualmente e mantenha na sua biblioteca para sempre.</p>
                </div>
            </div>
        </div>

        <div class="filtros">
            <input type="text" id="campoBusca" placeholder="Buscar por nome do jogo...">
            <select id="filtroGenero">
                <option value="Todos">Todos os Gêneros</option>
                <option value="RPG">RPG</option>
                <option value="Corrida">Corrida</option>
                <option value="Estratégia">Estratégia</option>
                <option value="Ação">Ação</option>
                <option value="Aventura">Aventura</option>
                <option value="Esporte">Esporte</option>
            </select>
            <select id="filtroPlano">
                <option value="Todos">Todos os Planos</option>
                <option value="Incluso">Incluso na Assinatura</option>
                <option value="Avulso">Apenas Compra</option>
            </select>
        </div>

        <div class="card-grid" id="catalogo"></div>
    </div>

    <script>
        const jogos = [
            { titulo: "Cyber Odyssey 2077", genero: "RPG", preco: 149.90, inclusoNoPlano: true },
            { titulo: "Speed Racers Unlimited", genero: "Corrida", preco: 89.90, inclusoNoPlano: true },
            { titulo: "Galactic Legends", genero: "Estratégia", preco: 199.90, inclusoNoPlano: false },
            { titulo: "Shadow Strike", genero: "Ação", preco: 120.00, inclusoNoPlano: true },
            { titulo: "Kingdom Quest", genero: "RPG", preco: 159.90, inclusoNoPlano: false },
            { titulo: "Pro Football 2026", genero: "Esporte", preco: 249.90, inclusoNoPlano: false },
            { titulo: "Pixel Dungeon Adventure", genero: "Aventura", preco: 49.90, inclusoNoPlano: true },
            { titulo: "Space Warfare", genero: "Estratégia", preco: 79.90, inclusoNoPlano: true },
            { titulo: "Urban Drift", genero: "Corrida", preco: 59.90, inclusoNoPlano: true }
        ];

        const container = document.getElementById('catalogo');
        const campoBusca = document.getElementById('campoBusca');
        const filtroGenero = document.getElementById('filtroGenero');
        const filtroPlano = document.getElementById('filtroPlano');

        function renderizarJogos() {
            const termoBusca = campoBusca.value.toLowerCase();
            const generoSelecionado = filtroGenero.value;
            const planoSelecionado = filtroPlano.value;

            container.innerHTML = '';

            const jogosFiltrados = jogos.filter(jogo => {
                const combinaTitulo = jogo.titulo.toLowerCase().includes(termoBusca);
                const combinaGenero = generoSelecionado === 'Todos' || jogo.genero === generoSelecionado;
                
                let combinaPlano = true;
                if (planoSelecionado === 'Incluso') combinaPlano = jogo.inclusoNoPlano;
                if (planoSelecionado === 'Avulso') combinaPlano = !jogo.inclusoNoPlano;

                return combinaTitulo && combinaGenero && combinaPlano;
            });

            if (jogosFiltrados.length === 0) {
                container.innerHTML = '<p class="sem-resultados">Nenhum jogo encontrado com os filtros selecionados.</p>';
                return;
            }

            jogosFiltrados.forEach(jogo => {
                const card = document.createElement('div');
                card.className = 'card';
                
                const badgeClass = jogo.inclusoNoPlano ? 'badge-sub' : 'badge-compra';
                const badgeTexto = jogo.inclusoNoPlano ? 'Incluso na Assinatura' : 'Compra Avulsa';

                card.innerHTML = `
                    <div>
                        <span class="genero">${jogo.genero}</span>
                        <h3>${jogo.titulo}</h3>
                    </div>
                    <div class="card-detalhes">
                        <p class="preco">R$ ${jogo.preco.toFixed(2)}</p>
                    </div>
                    <span class="badge ${badgeClass}">${badgeTexto}</span>
                `;
                container.appendChild(card);
            });
        }

        campoBusca.addEventListener('input', renderizarJogos);
        filtroGenero.addEventListener('change', renderizarJogos);
        filtroPlano.addEventListener('change', renderizarJogos);

        renderizarJogos();
    </script>
</body>
</html>
